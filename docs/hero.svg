<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08142A"/>
      <stop offset="0.45" stop-color="#0C2F56"/>
      <stop offset="1" stop-color="#0E4A73"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2ED3C6"/>
      <stop offset="1" stop-color="#1FA3E5"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <filter id="blur" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>

  <g opacity="0.5" filter="url(#blur)">
